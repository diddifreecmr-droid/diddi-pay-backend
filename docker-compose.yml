services:
  db:
    image: postgres:16-alpine
    container_name: payfund-db
    environment:
      POSTGRES_USER: payfund
      POSTGRES_PASSWORD: payfund
      POSTGRES_DB: payfund
    # Port hôte configurable via .env (POSTGRES_PORT). Ce projet est hébergé aux côtés d'autres
    # piles complètes (Postgres/Redis/Flask/...) sur le même serveur — ne jamais supposer qu'un
    # port "par défaut" (ni même le suivant en séquence) est libre. Vérifier avant déploiement
    # (`ss -tulpn`, `docker ps --format "{{.Names}}: {{.Ports}}"`) puis fixer la valeur dans .env,
    # jamais ici.
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - payfund_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payfund"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: payfund-redis
    # Même remarque que ci-dessus : port hôte configurable via .env (REDIS_PORT).
    ports:
      - "${REDIS_PORT:-61780}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payfund-app
    environment:
      # Communication interne au réseau Compose : noms de service + ports internes fixes — pas
      # `localhost`, pas les ports hôte configurables. POSTGRES_PORT/REDIS_PORT ne concernent
      # que l'accès *depuis l'hôte* (utile en dev local, quand l'app tourne hors Docker) ; entre
      # conteneurs du même réseau Compose, le nom du service fait office de DNS et le port
      # interne (5432/6379) ne bouge jamais.
      DATABASE_URL: postgresql+psycopg://payfund:payfund@db:5432/payfund
      REDIS_URL: redis://redis:6379/0
      DIDDIFREEID_JWKS_URL: ${DIDDIFREEID_JWKS_URL:-https://auth-staging.diddifree.com/identity/v1/.well-known/jwks.json}
      DIDDIFREEID_ISSUER: ${DIDDIFREEID_ISSUER:-diddifree-id}
      DIDDIFREEID_STEP_UP_MAX_TTL_SECONDS: ${DIDDIFREEID_STEP_UP_MAX_TTL_SECONDS:-300}
      EVENT_BUS_CHANNEL: ${EVENT_BUS_CHANNEL:-diddifree.events}
      PAYMENT_GATEWAY_MODE: ${PAYMENT_GATEWAY_MODE:-stub}
      PAYMENT_GATEWAY_AUTOCONFIRM: ${PAYMENT_GATEWAY_AUTOCONFIRM:-false}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      PAYSTACK_BASE_URL: ${PAYSTACK_BASE_URL:-https://api.paystack.co}
      PAYMENT_SERVICE_KEYS: ${PAYMENT_SERVICE_KEYS:-}
      PAYMENT_PROCESSOR_MODE: ${PAYMENT_PROCESSOR_MODE:-sandbox}
      PAYMENT_CALLBACK_TARGETS: ${PAYMENT_CALLBACK_TARGETS:-{}}
      DIDDIFUND_DIDDIPAY_CALLBACK_SECRET: ${DIDDIFUND_DIDDIPAY_CALLBACK_SECRET:-}
      WALLET_STEP_UP_THRESHOLD_XOF: ${WALLET_STEP_UP_THRESHOLD_XOF:-50000}
      DEFAULT_INTEREST_RATE: ${DEFAULT_INTEREST_RATE:-6.5}
      SQL_ECHO: ${SQL_ECHO:-false}
      # Le déploiement ne se fait pas forcément via `docker compose` en CLI avec un `.env` à
      # côté du fichier (ex. Portainer, qui clone le dépôt et n'a donc jamais accès à un `.env`
      # non versionné) : une variable obligatoire ici (`${VAR:?...}`) ferait échouer le simple
      # pull de l'image, avant même que l'outil de déploiement ait pu injecter quoi que ce soit.
      # Valeur par défaut = celle du code (voir `core/config.py`), donc pas plus sûre que lui —
      # à écraser explicitement en production, via l'UI de variables d'environnement de l'outil
      # de déploiement (README section « Déploiement via Portainer »), jamais dans ce fichier.
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      # Port hôte configurable — même remarque que pour db/redis ci-dessus.
      - "${APP_PORT:-48213}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/payfund/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  payfund_pgdata:
