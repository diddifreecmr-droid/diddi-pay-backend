services:
  app:
    environment:
      OBSERVABILITY_LOG_FILE: /var/log/diddipay/app.jsonl
    volumes:
      - payfund_app_logs:/var/log/diddipay
    depends_on:
      otel-collector:
        condition: service_started

  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: payfund-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/observability/prometheus/slo-rules.yml:/etc/prometheus/slo-rules.yml:ro
      - ${METRICS_TOKEN_FILE:-./.secrets/metrics_token}:/run/secrets/diddipay_metrics_token:ro
      - payfund_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-49090}:9090"
    depends_on:
      app:
        condition: service_healthy
      alertmanager:
        condition: service_started
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.0
    container_name: payfund-alertmanager
    profiles: ["observability"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${ALERT_WEBHOOK_URL_FILE:-./.secrets/alert_webhook_url}:/run/secrets/alert_webhook_url:ro
      - payfund_alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-49093}:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.1
    container_name: payfund-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - payfund_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-43000}:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.7
    container_name: payfund-loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki.yml"]
    volumes:
      - ./deploy/observability/loki/loki.yml:/etc/loki.yml:ro
      - payfund_loki_data:/var/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-43100}:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: payfund-alloy
    profiles: ["observability"]
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - payfund_app_logs:/var/log/diddipay:ro
      - payfund_alloy_data:/var/lib/alloy
    depends_on:
      - app
      - loki
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: payfund-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./deploy/observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - tempo
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.3
    container_name: payfund-tempo
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./deploy/observability/tempo/tempo.yml:/etc/tempo.yml:ro
      - payfund_tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-43200}:3200"
    restart: unless-stopped

volumes:
  payfund_app_logs:
  payfund_loki_data:
  payfund_alloy_data:
  payfund_prometheus_data:
  payfund_grafana_data:
  payfund_alertmanager_data:
  payfund_tempo_data:
