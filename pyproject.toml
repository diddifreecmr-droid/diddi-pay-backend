[project]
name = "payfund-app"
version = "0.1.0"
description = "DiddiPay (wallet) + DiddiFund (fund) — monolithe modulaire"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "redis>=5.2",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Utilisé directement par tests/conftest.py pour charger .env — jusqu'ici seulement une
    # dépendance transitive de pydantic-settings, désormais nécessaire aux tests eux-mêmes.
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["payfund_app*"]
