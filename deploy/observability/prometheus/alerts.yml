groups:
  - name: diddipay-availability
    rules:
      - alert: DiddiPayMetricsTargetDown
        expr: up{job="diddipay"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: DiddiPay is unavailable to Prometheus
          description: Prometheus has failed to scrape DiddiPay for more than two minutes.

      - alert: DiddiPayHighHttp5xxRate
        expr: |
          sum(rate(diddipay_http_requests_total{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(diddipay_http_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: DiddiPay HTTP 5xx rate exceeds 5 percent
          description: More than 5 percent of DiddiPay HTTP requests failed for ten minutes.

  - name: diddipay-payments
    rules:
      - alert: DiddiPayProviderTransportErrors
        expr: increase(diddipay_provider_calls_total{outcome="transport_error"}[10m]) > 2
        labels:
          severity: warning
        annotations:
          summary: Repeated payment provider transport errors
          description: A provider produced more than two transport errors in ten minutes.

      - alert: DiddiPayProviderLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, provider) (rate(diddipay_provider_call_duration_seconds_bucket[5m]))
          ) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Payment provider p95 latency exceeds five seconds
          description: Provider latency can delay checkout and reconciliation.

      - alert: DiddiPayWebhookRejections
        expr: increase(diddipay_webhook_events_total{outcome="rejected"}[5m]) > 5
        labels:
          severity: warning
        annotations:
          summary: Repeated provider webhook signature rejections
          description: Verify the webhook secret and investigate possible unauthorized traffic.

      - alert: DiddiPayOutboxDeadLetters
        expr: diddipay_outbox_events{status="dead_letter"} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: DiddiPay has callback events in dead letter
          description: A module may not have received a final payment event and requires ops review.
