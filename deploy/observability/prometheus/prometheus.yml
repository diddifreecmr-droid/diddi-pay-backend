global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: diddipay
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/diddipay_metrics_token
    static_configs:
      - targets: ["app:8000"]
