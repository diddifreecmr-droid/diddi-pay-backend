global:
  resolve_timeout: 5m

route:
  receiver: ops-warning
  group_by: ["alertname", "severity", "provider"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h
  routes:
    - receiver: ops-critical
      matchers:
        - severity="critical"
      repeat_interval: 30m
    - receiver: ops-warning
      matchers:
        - severity="warning"
      repeat_interval: 2h

receivers:
  - name: ops-critical
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        max_alerts: 20
        timeout: 10s
  - name: ops-warning
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        max_alerts: 20
        timeout: 10s

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ["alertname", "provider"]
